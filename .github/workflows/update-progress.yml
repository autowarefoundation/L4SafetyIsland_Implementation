name: Update progress counts

# Recount the (completed / open) issues shown in README.md's Progress section
# whenever an issue changes state or labels. When a count changed, the new
# README goes to main through a pull request, the gate and the merge queue,
# like any other change: the main-branch ruleset lets nothing push to main.
#
# The pull request comes from the bot branch bot/update-progress-counts,
# rebuilt from main on every run, so there is at most one such pull request
# and it always carries the latest counts.
#
# A pull request opened or pushed with the workflow token (GITHUB_TOKEN)
# starts no pull_request workflow, so the gate would never report on it. The
# workflow token may still dispatch a workflow, so this job runs the gate on
# the bot branch with workflow_dispatch. The gate's check runs attach to the
# branch head, which is the pull request's head, and satisfy the required
# `gate` check. The pull-request-only checks (title, DCO, spelling) are
# skipped on a dispatch, as on a merge group. See docs/ci/repository-setup.md.

on:
  issues:
    types: [opened, closed, reopened, deleted, transferred, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"   # daily backstop, 00:17 UTC

permissions:
  contents: write        # push the bot branch
  pull-requests: write   # open the pull request and enable auto-merge
  actions: write         # dispatch the gate on the bot branch
  issues: read           # count the issues

concurrency:
  group: update-progress-counts
  cancel-in-progress: false

env:
  BOT_BRANCH: bot/update-progress-counts

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Recount issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_progress_counts.py README.md

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BOT_BRANCH"
          git add README.md
          git commit -m "docs(readme): update progress counts"
          # The bot branch belongs to this workflow; each run rebuilds it from main.
          git push --force origin "HEAD:refs/heads/$BOT_BRANCH"

          pr=$(gh pr list --head "$BOT_BRANCH" --base main --state open --json url --jq '.[0].url')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$BOT_BRANCH" \
              --title "docs(readme): update progress counts" \
              --body "Recounted by the [progress workflow](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/update-progress.yml). Merges itself through the merge queue once the gate passes.")
          fi
          echo "Pull request: $pr"

          # The token's push starts no pull_request run; dispatch the gate.
          gh workflow run gate.yaml --ref "$BOT_BRANCH"

          # Queue the pull request once the gate passes. A push removes it
          # from the queue, so enable this on every run.
          gh pr merge --auto --rebase "$pr"
