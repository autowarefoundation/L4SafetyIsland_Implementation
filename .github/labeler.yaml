# Path labels for pull requests (pr-labeler.yaml), as autoware_universe does,
# in the configuration format of actions/labeler v5 and later.
# docs/design/work-management.md section 4 lists them.

"component:island":
  - changed-files:
      - any-glob-to-any-file: src/autoware_si_*/**
"component:msgs":
  - changed-files:
      - any-glob-to-any-file: src/autoware_safety_island_msgs/**
"component:bringup":
  - changed-files:
      - any-glob-to-any-file: src/autoware_safety_island_bringup/**
"component:contracts":
  - changed-files:
      - any-glob-to-any-file: "**/*.contract.yaml"
"component:platform":
  - changed-files:
      - any-glob-to-any-file: [crates/**, platforms/**]
"type:ci":
  - changed-files:
      - any-glob-to-any-file: [.github/**, ci/**]
"type:documentation":
  - changed-files:
      - any-glob-to-any-file: docs/**
