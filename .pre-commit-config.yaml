# Autoware's pre-commit hooks (sync-file-templates, as in autoware_core) that
# apply to this repository, plus the Rust formatter.
#
# Files owned by the planning automation (README progress counts, milestone
# and issue scripts, the plan documents and slides) are excluded: their owner
# formats them, and the progress workflow rewrites README.md on main.

ci:
  autofix_commit_msg: "style(pre-commit): autofix"
  autoupdate_schedule: quarterly
  autoupdate_commit_msg: "ci(pre-commit): quarterly autoupdate"

exclude: |
  (?x)^(
    README\.(md|html)|
    docs/(ARCHITECTURE|MILESTONES|PLATFORM-CHOICE|PLAN-S32Z2|WP0-WP3-SafetyFloor)\.(md|html)|
    slides/.*|
    \.github/milestones/.*|
    \.github/scripts/(update_progress_counts|replace_in_issues)\.py|
    \.github/workflows/(update-progress|sync-milestones|edit-issues)\.yml
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/tier4/pre-commit-hooks-ros
    rev: v0.10.3
    hooks:
      - id: flake8-ros
      - id: prettier-launch-xml
      - id: prettier-package-xml
      - id: ros-include-guard
      - id: sort-package-xml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        args: [--quiet]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-metaschema
        files: ^.+/schema/.*schema\.json$

  - repo: https://github.com/autowarefoundation/autoware-spell-check-dict
    rev: 11cff6151a3c2141850535c0d62e5e13a7383c5f
    hooks:
      - id: format-cspell-json

  - repo: local
    hooks:
      - id: check-msg-bounds
        name: check message bounds
        description: Refuse unbounded string and sequence fields in message packages.
        entry: python3 -B scripts/check_msg_bounds.py
        language: system
        files: ^src/.*/(msg|srv)/.*\.(msg|srv)$
      - id: cargo-fmt
        name: cargo fmt
        description: Format the Rust workspace and the Rust node packages with rustfmt.
        entry: rustfmt --edition 2024 --config-path rustfmt.toml
        language: system
        types: [rust]
